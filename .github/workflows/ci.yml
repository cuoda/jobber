name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    # ✅ PostgreSQL container
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobber_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jobber_auth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # ✅ Prisma will read this
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobber_auth

    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      # Optional: Wait until Postgres is healthy
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -U postgres -d jobber_auth; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - run: pnpm exec nx affected -t lint test build

      - run: pnpm exec nx fix-ci
        if: always()
